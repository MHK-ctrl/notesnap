<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder screenshot for the README.
  Replace this file with a real photo/GIF of NoteSnap (a phone screenshot works
  best) once you've deployed, and keep the same `docs/screenshot.svg` reference
  in README.md — or update the link to screenshot.png / demo.gif.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="NoteSnap app: a photo of a handwritten page next to the transcribed text">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <pattern id="lines" width="100%" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27.5" x2="100%" y2="27.5" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>

  <text x="48" y="72" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#0f172a">NoteSnap</text>
  <text x="48" y="104" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#475569">photo of handwritten notes → clean, paste-ready text</text>

  <!-- phone / photo card -->
  <g transform="translate(48 140)">
    <rect width="392" height="396" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">Your photo</text>
    <rect x="24" y="56" width="344" height="280" rx="14" fill="#fefdf7" stroke="#e2e8f0"/>
    <g transform="translate(48 96)">
      <text font-family="'Segoe Script', 'Bradley Hand', cursive" font-size="22" fill="#1e3a8a" transform="rotate(-1)">Shopping list</text>
      <text y="46" font-family="'Segoe Script', 'Bradley Hand', cursive" font-size="20" fill="#1e3a8a" transform="rotate(-.6)">- oat milk</text>
      <text y="88" font-family="'Segoe Script', 'Bradley Hand', cursive" font-size="20" fill="#1e3a8a" transform="rotate(-.4)">- rye bread</text>
      <text y="130" font-family="'Segoe Script', 'Bradley Hand', cursive" font-size="20" fill="#1e3a8a" transform="rotate(-.8)">- call plumber 2pm</text>
      <text y="172" font-family="'Segoe Script', 'Bradley Hand', cursive" font-size="20" fill="#1e3a8a" transform="rotate(-.3)">- renew parking pass</text>
    </g>
    <text x="24" y="362" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">IMG_2043.jpg · 1.2 MB · 2200×1650 · resized before upload</text>
  </g>

  <!-- arrow -->
  <g transform="translate(456 320)">
    <path d="M0 0 H48" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 -9 L52 0 L40 9" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- result card -->
  <g transform="translate(520 140)">
    <rect width="392" height="396" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="24" y="38" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">Your text</text>
    <text x="24" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Exactly as read — no autocorrect</text>
    <rect x="24" y="76" width="344" height="228" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#0f172a">
      <text x="40" y="106">Shopping list</text>
      <text x="40" y="134">- oat milk</text>
      <text x="40" y="162">- rye bread</text>
      <text x="40" y="190">- call plumber 2pm</text>
      <text x="40" y="218">- renew parking pass</text>
    </g>
    <g transform="translate(24 324)">
      <rect width="120" height="40" rx="10" fill="#4f46e5"/>
      <text x="24" y="25" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Copy text</text>
      <rect x="132" width="146" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="160" y="25" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Re-transcribe</text>
      <text x="296" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Start over</text>
    </g>
  </g>

  <text x="48" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">Placeholder image — replace docs/screenshot.svg with a real screenshot or GIF.</text>
</svg>
